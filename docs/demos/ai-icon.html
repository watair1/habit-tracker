<title>AI 아이콘 후보</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 레이아웃: 후보마다 한 줄 카드(큰 그림 · 버튼 2색 · 글자 옆 작은 크기). 어두운 한 가지 모습 */
:root {
  --bg: #0b0c10;
  --card: #13151b;
  --edge: #252833;
  --fg: #ece9e2;
  --mute: #8f8c99;
  --lime: #b3f000;
  --ink: #16181f;
  --font: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); line-height: 1.5; }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 26px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
header { display: grid; gap: 4px; margin-bottom: 6px; }
.k { font-family: var(--mono); font-size: 12px; color: var(--lime); letter-spacing: .08em; }
h1 { margin: 0; font-size: clamp(26px, 5vw, 34px); font-weight: 700; }
header p { margin: 0; color: var(--mute); font-size: 14px; max-width: 64ch; }
.row { display: grid; grid-template-columns: 32px 96px minmax(0, 1fr) auto; gap: 18px; align-items: center; background: var(--card); border: 1px solid var(--edge); border-radius: 16px; padding: 16px 18px; }
@media (max-width: 640px) { .row { grid-template-columns: 26px 72px minmax(0, 1fr); } .row .uses { grid-column: 2 / -1; } }
.num { font-family: var(--mono); font-size: 13px; color: var(--mute); }
.big { width: 96px; height: 96px; color: var(--fg); }
@media (max-width: 640px) { .big { width: 72px; height: 72px; } }
.big svg { width: 100%; height: 100%; }
.txt { display: grid; gap: 2px; min-width: 0; }
.txt b { font-size: 15px; font-weight: 700; }
.txt span { font-size: 13px; color: var(--mute); }
.uses { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.fab { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.fab svg { width: 24px; height: 24px; }
.fab.lime { background: linear-gradient(145deg, #c9ff3d, var(--lime)); color: #000; box-shadow: 0 8px 20px rgba(179,240,0,.25); }
.fab.dark { background: #e9e4da; color: var(--ink); }
.inline { display: grid; gap: 6px; font-size: 13.5px; }
.inline div { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--edge); border-radius: 10px; white-space: nowrap; }
.inline svg { width: 15px; height: 15px; color: var(--lime); }
.note { font-size: 12.5px; color: var(--mute); margin: 6px 0 0; }
</style>

<div class="wrap">
  <header>
    <div class="k">AI 아이콘 · 후보</div>
    <h1>AI 아이콘 후보</h1>
    <p>0번은 지금 앱에 있는 반짝이(✨)야. 1~6번이 새 후보. 큰 그림, 실제 버튼 크기(54px) 두 가지 색, 글자 옆 작은 크기(15px)로 같이 보여줘. 색은 테마가 아직이라 모양만 보면 돼.</p>
  </header>
  <div id="list"></div>
  <p class="note">전부 24칸 격자에 선 굵기 1.75로 맞춰 직접 그렸어. 고르면 그 하나를 더 다듬어서 앱에 넣을게. 섞어도 돼(예: 3번 모양에 5번 점).</p>
</div>

<script>
(() => {
// 모두 viewBox 0 0 24 24, 선 굵기 1.75, 둥근 끝
const S = 'fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = [
  { name: '지금 쓰는 것 (반짝이)', why: '아이콘 세트 기본. AI 아이콘 중 제일 흔함.',
    svg: `<path ${S} d="M9.9 4.6 11 8.2a2.2 2.2 0 0 0 1.5 1.5l3.6 1.1-3.6 1.1a2.2 2.2 0 0 0-1.5 1.5L9.9 17l-1.1-3.6a2.2 2.2 0 0 0-1.5-1.5L3.7 10.8l3.6-1.1a2.2 2.2 0 0 0 1.5-1.5Z"/><path ${S} d="M18.5 3v4M16.5 5h4M18.5 16.5v3M17 18h3"/>` },
  { name: '작은 신경망', why: '2-3-1 층을 선으로 이은 것. 일반적인 신경망 모양을 아이콘으로. 오른쪽 끝 하나가 답.',
    svg: `<g fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.15" opacity=".7"><path d="M4.5 7 12 5.5M4.5 7 12 12M4.5 7 12 18.5M4.5 17 12 5.5M4.5 17 12 12M4.5 17 12 18.5M12 5.5 19.5 12M12 12 19.5 12M12 18.5 19.5 12"/></g><g fill="currentColor"><circle cx="4.5" cy="7" r="1.55"/><circle cx="4.5" cy="17" r="1.55"/><circle cx="12" cy="5.5" r="1.55"/><circle cx="12" cy="12" r="1.55"/><circle cx="12" cy="18.5" r="1.55"/><circle cx="19.5" cy="12" r="2.1"/></g>` },
  { name: '말하는 노드', why: '말풍선 안에 이어진 점 세 개. "말 걸면 처리해 주는 비서".',
    svg: `<path ${S} d="M6.5 4.5h11a3 3 0 0 1 3 3v6.5a3 3 0 0 1-3 3H11l-4.5 3.5V17h0a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.3" d="M8.3 12.4 12 9.6l3.7 2.8"/><g fill="currentColor"><circle cx="8.3" cy="12.4" r="1.4"/><circle cx="12" cy="9.6" r="1.4"/><circle cx="15.7" cy="12.4" r="1.4"/></g>` },
  { name: '움직이는 커서', why: '우리 AI 비서는 커서가 화면을 돌아다니며 직접 해 주잖아. 그 커서 + 지나온 자국.',
    svg: `<path ${S} d="M9 4.5 9 17l3.3-3.1 2.4 5.1 2.3-1.1-2.4-5h4.6Z"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" opacity=".6" d="M3.5 8.5h2.5M2.8 12h3.2M4 15.5h2"/>` },
  { name: '새싹 매듭', why: '습관 앱이니까 자라는 것. 새싹 잎맥이 노드처럼 이어짐.',
    svg: `<path ${S} d="M12 20.5V11"/><path ${S} d="M12 13.5c-4.5 0-7-2.6-7-7 4.4 0 7 2.5 7 7Z"/><path ${S} d="M12 11c0-4 2.4-6.5 7-6.5 0 4.2-2.5 6.5-7 6.5Z"/><g fill="currentColor"><circle cx="12" cy="11" r="1.6"/><circle cx="12" cy="20.5" r="1.4"/></g>` },
  { name: '궤도 (다듬음)', why: '눈처럼 보여서 다듬었어. 가운데를 꽉 찬 행성으로, 궤도는 더 가늘고 기울게, 작은 별은 궤도 위에.',
    svg: `<ellipse fill="none" stroke="currentColor" stroke-width="1.5" cx="12" cy="12" rx="9.6" ry="3.4" transform="rotate(-26 12 12)"/><circle fill="currentColor" cx="12" cy="12" r="3.2"/><circle fill="currentColor" cx="17.65" cy="6.81" r="1.75"/>` },
  { name: '한 줄 반짝 (다듬은 별)', why: '반짝이를 버리지 않고 별 하나만, 조금 비대칭으로 다듬은 것. 익숙함은 유지.',
    svg: `<path ${S} d="M12 3.2c.5 4.4 2.3 6.6 6.8 7.6-4.5 1-6.3 3.4-6.8 9.9-.5-6.5-2.3-8.9-6.8-9.9 4.5-1 6.3-3.2 6.8-7.6Z"/><circle fill="currentColor" cx="19" cy="18.5" r="1.3"/>` },
];
const list = document.getElementById('list');
list.innerHTML = ICONS.map((ic, i) => {
  const svg = `<svg viewBox="0 0 24 24" aria-hidden="true">${ic.svg}</svg>`;
  return `<div class="row" style="margin-bottom:12px${i === 0 ? ';opacity:.7' : ''}">
    <div class="num">${i}</div>
    <div class="big">${svg}</div>
    <div class="txt"><b>${ic.name}</b><span>${ic.why}</span></div>
    <div class="uses">
      <div class="fab lime" title="지금 버튼 색">${svg}</div>
      <div class="fab dark" title="밝은 버튼">${svg}</div>
      <div class="inline"><div>${svg}AI 비서</div><div>${svg}AI 분석 받기</div></div>
    </div></div>`;
}).join('');
})();
</script>
